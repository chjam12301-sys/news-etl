name: 构建词库（ECDICT 高频子集）

# 只在需要时手动跑，不挂定时任务：
# 词库是存量数据，不像新闻每天都要新的。真到「App 查不到某个词」时再重跑。
#
# 产物两处：
#   1. Git  data/dict/ecdict-subset.json   生成端构建期查它，补音标与英文释义
#   2. R2   dict/en/<前两字母>.json         运行时查询接口读它
#
# 刻意排成「先落索引、再传 R2」：索引是 App 立刻要用的（快、必成），
# 上传 R2 只服务将来的查词接口（慢、可重跑）。上传万一超时，索引也已经提交。
on:
  workflow_dispatch:
    inputs:
      top:
        description: '取词数量（按词频排序取前 N）'
        required: false
        default: '20000'
      upload:
        description: '是否上传 R2（false = 只构建并提交索引）'
        required: false
        default: 'true'

concurrency:
  group: build-dict
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: write          # 提交 data/dict/ecdict-subset.json

    env:
      # 词条与音频共用同一组 R2 密钥，key 前缀不同（dict/en/ 与 audio/）
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 缓存 ECDICT 全量 CSV
        # 62.9MB，别每次都重下。key 固定：上游文件是词库快照，不会天天变。
        # 想强制重下就把 key 的版本号从 v1 往上加。
        uses: actions/cache@v4
        with:
          path: dist/ecdict.csv
          key: ecdict-csv-v1

      - name: 构建子集（下载 → 解析 → 分片 + 索引）
        env:
          TOP: ${{ inputs.top }}
        run: python -m scripts.build_dict --build-only --top "${TOP:-20000}"

      - name: 校验产物
        run: |
          set +e
          echo "--- 分片 ---"
          echo "dist/dict/shards: $(find dist/dict/shards -name '*.json' 2>/dev/null | wc -l | tr -d ' ') 个"
          du -sh dist/dict/shards 2>/dev/null
          echo "--- 索引 ---"
          ls -lh data/dict/ecdict-subset.json 2>/dev/null || echo "(索引缺失)"
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/dict/ecdict-subset.json")
          if not p.is_file():
              print("  ✗ 索引不存在"); raise SystemExit(0)
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"  词数 {len(d)}")
          for w in ("trade", "economy", "artificial", "regulate"):
              v = d.get(w)
              print(f"  {w:12} {v}" if v else f"  {w:12} (未收录)")
          miss_en = sum(1 for v in d.values() if not v.get("en"))
          miss_ph = sum(1 for v in d.values() if not v.get("phonetic"))
          print(f"  缺英文释义 {miss_en} 条（{miss_en/max(len(d),1)*100:.1f}%）")
          print(f"  缺音标     {miss_ph} 条（{miss_ph/max(len(d),1)*100:.1f}%）")
          PY
          set -e

      - name: 提交索引
        # 放在上传之前：这一步是 App 侧要用的成果，不能因为上传慢/失败而丢掉
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/dict/ecdict-subset.json
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
            exit 0
          fi
          COUNT=$(python -c "import json;print(len(json.load(open('data/dict/ecdict-subset.json',encoding='utf-8'))))")
          git commit -m "dict: 更新词库索引（${COUNT} 词）"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push

      - name: 上传分片到 R2
        if: ${{ inputs.upload != 'false' }}
        run: python -m scripts.build_dict --upload-only --prune-legacy --workers 8

      - name: 抽检 R2 上的词条
        if: ${{ inputs.upload != 'false' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          base = (os.environ.get("R2_PUBLIC_BASE") or "").rstrip("/")
          if not base:
              print("(未配置 R2_PUBLIC_BASE，跳过抽检)")
              raise SystemExit(0)

          def shard_of(word):
              def ch(i):
                  c = word[i] if i < len(word) else "_"
                  return c if (c.isascii() and c.isalnum()) else "_"
              return ch(0) + ch(1)

          for w in ("trade", "economy", "artificial", "regulate"):
              url = f"{base}/dict/en/{shard_of(w)}.json"
              try:
                  # r2.dev 会把 Python-urllib 的 UA 当爬虫直接 403（curl 却放行），
                  # 必须显式带一个正常 UA，否则抽检永远"失败"、掩盖真实问题。
                  req = urllib.request.Request(url, headers={"User-Agent": "day-dict-probe/1.0"})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      shard = json.loads(r.read().decode("utf-8"))
                  hit = shard.get(w)
                  print(f"  {w:11} {hit if hit else '(shard 在，但这个词不在里面)'}")
              except Exception as exc:  # noqa: BLE001
                  print(f"  {w:11} ✗ {type(exc).__name__}: {exc}")
          PY
