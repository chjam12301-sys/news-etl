name: 每日内容生成

# 北京时间每天 05:30 = UTC 21:30。故意避开整点，错开 GitHub 调度高峰。
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      topics:
        description: '主题（逗号分隔，留空=全部 7 个）'
        required: false
      force:
        description: '仅补当天目标缺失译文；不新增文章'
        required: false
        default: 'false'
      warmup_only:
        description: '只补今日已有文章的四种音色，不生成/发布文章'
        required: false
        default: 'false'

# Free 计划同一时间只允许 1 个并发
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write          # 推送 content/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史，便于取 commit SHA 做 CDN cache-buster
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt && pip install -r requirements-kokoro.txt

      - name: 网络与依赖自检
        run: |
          set +e
          echo "--- Openverse（CC0 配图源）---"
          curl -s -o /dev/null -w "  api.openverse.org: HTTP %{http_code}  %{time_total}s\n" \
            --max-time 20 "https://api.openverse.org/v1/images/?q=test&page_size=1"
          echo "--- DeepSeek ---"
          curl -s -o /dev/null -w "  api.deepseek.com: HTTP %{http_code}\n" \
            --max-time 20 https://api.deepseek.com/v1/models
          echo "--- Neon（数据库）---"
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          try:
              e = create_engine(os.environ["DATABASE_URL"], connect_args={"connect_timeout": 15})
              with e.connect() as c:
                  c.execute(text("select 1"))
              print("  Neon: 连接正常")
          except Exception as exc:
              print(f"  Neon: {type(exc).__name__} {str(exc)[:90]}")
          PY

          echo "--- edge-tts（Azure IP 直连，生产路径）---"
          python - <<'PY'
          import asyncio, os
          import edge_tts
          import edge_tts.constants as C

          # 复刻 app/tts.py 的版本补丁，隔离版本因素、专测 IP 封锁
          ver = os.environ.get("EDGE_TTS_CHROMIUM_VERSION", "155.0.4283.45")
          C.CHROMIUM_FULL_VERSION = ver
          C.CHROMIUM_MAJOR_VERSION = ver.split(".", 1)[0]
          C.SEC_MS_GEC_VERSION = f"1-{ver}"
          ua = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                f" (KHTML, like Gecko) Chrome/{C.CHROMIUM_MAJOR_VERSION}.0.0.0 Safari/537.36"
                f" Edg/{C.CHROMIUM_MAJOR_VERSION}.0.0.0")
          C.BASE_HEADERS["User-Agent"] = ua
          for d in (C.WSS_HEADERS, C.VOICE_HEADERS):
              d.update(C.BASE_HEADERS)
          C.VOICE_HEADERS["Sec-CH-UA"] = (
              f'" Not;A Brand";v="99", "Microsoft Edge";v="{C.CHROMIUM_MAJOR_VERSION}",'
              f' "Chromium";v="{C.CHROMIUM_MAJOR_VERSION}"')
          edge_tts.communicate.SEC_MS_GEC_VERSION = C.SEC_MS_GEC_VERSION

          async def probe():
              try:
                  comm = edge_tts.Communicate("Hello, this is a connectivity test.", "en-US-AriaNeural", boundary="WordBoundary")
                  chunks = 0
                  async for _ in comm.stream():
                      chunks += 1
                  print(f"  edge-tts (Azure 直连): 成功, {chunks} 个流分片 -> CI 无需代理")
              except Exception as e:
                  st = getattr(e, "status", None) or getattr(e, "code", None)
                  tag = f" [HTTP {st}]" if st else ""
                  print(f"  edge-tts (Azure 直连): 失败 {type(e).__name__}{tag} - {str(e)[:140]}")
                  print("  -> 若 403: Azure 数据中心 IP 被微软标记, 需走代理出口或 CI 内自托管 OSS TTS")

          asyncio.run(probe())
          PY
          set -e

      - name: 组装参数
        id: args
        env:
          IN_TOPICS: ${{ inputs.topics }}
          IN_FORCE: ${{ inputs.force }}
          IN_WARMUP_ONLY: ${{ inputs.warmup_only }}
        run: |
          ARGS="daily"
          if [ -n "${IN_TOPICS}" ]; then ARGS="$ARGS --topics ${IN_TOPICS}"; fi
          if [ "${IN_FORCE}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${IN_WARMUP_ONLY}" = "true" ]; then ARGS="$ARGS --warmup-only"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "将要执行: python -m app.cli $ARGS"

      - name: 生成内容（抓取 → 中英日改写 → TTS+时间轴 → 导出 → 提交）
        env:
          # JSON：GitHub 仓库 + jsDelivr CDN（保留 @<commit> 不可变版本能力）
          STORAGE_BACKEND: github
          GITHUB_CONTENT_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_KEEP_DAYS: "14"
          PUBLIC_BASE_URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/content

          # 音频：对象存储（R2）。音频不进 Git —— jsDelivr 单仓库 50MB 上限，
          # 音频 214MB 会把仓库撑爆，导致新路径一律 403。
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          STORAGE_LIMIT_GB: "8"

          # 数据库
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # LLM（中文译文靠它）
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          DEEPSEEK_MODEL: deepseek-chat

          # TTS —— 切换至 Kokoro OSS（CI 内自托管，免费不绑卡）。
          # 微软 readaloud 端点对数据中心 IP 封 403，edge-tts 直连已不可用；
          # Kokoro 原生暴露 token 级时间戳，可重建词级时间轴，App 跟读高亮照常。
          VOICE_WARMUP_TOKEN: ${{ secrets.VOICE_WARMUP_TOKEN }}
          TTS_ENABLED: "true"
          TTS_ENGINE: kokoro
          TTS_VOICE_EN: af_heart
          TTS_VOICE_JA: jf_alpha

          # 回退开关：把 TTS_ENGINE 改回 edge-tts 即回退原链路（此时 TTS_VOICE_EN/JA
          # 需改回微软 voice id）。EDGE_TTS_PROXY 仅在 edge-tts 模式下用于代理出口。
          EDGE_TTS_PROXY: ${{ secrets.EDGE_TTS_PROXY }}

          # 配图：多级降级 unsplash → pexels → wikimedia → openverse
          # 缺 key 的源会自动跳过，不会中断流水线
          IMAGE_FETCH_ENABLED: "true"
          IMAGE_PROVIDERS: unsplash,pexels,wikimedia,openverse
          IMAGE_ALLOW_SOURCE_FALLBACK: "false"
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_APP_NAME: daily-english-news
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          # 导出
          EXPORT_JSON: "true"
        run: python -m app.cli ${{ steps.args.outputs.args }}

      - name: 校验产物
        run: |
          set +e
          echo "--- content/ 产物 ---"
          ls -1 content/ 2>/dev/null || echo "(无)"
          echo "详情JSON: $(find content/data/versions -name '*.json' 2>/dev/null | wc -l) 份"
          MB=$(du -sm content 2>/dev/null | cut -f1)
          echo "仓库体积: ${MB}MB （jsDelivr 上限 50MB）"
          if [ "${MB:-0}" -gt 40 ]; then echo "  ⚠️ 接近上限，需清理"; fi
          echo "--- 音频是否走对象存储 ---"
          python - <<'PY'
          import json
          try:
              d = json.load(open("content/index.json", encoding="utf-8"))
              v = d["latest"]["versions"]["en"] or d["latest"]["versions"]["ja"]
              print("  audio.url =", (v[0].get("audio") or {}).get("url"))
          except Exception as exc:
              print("  (无法读取索引)", exc)
          PY
          echo "--- 自检：中译与时间轴 ---"
          python - <<'PY'
          import json, glob
          files = sorted(glob.glob("content/data/versions/*.json"))[:4]
          if not files:
              print("  ✗ 没有产物"); raise SystemExit
          for f in files:
              d = json.load(open(f, encoding="utf-8"))
              tl = d.get("timeline") or []
              zh = d.get("paragraphs_zh") or []
              paras = d.get("paragraphs") or []
              bad = 0
              if tl:
                  t = d["text"]
                  bad = sum(1 for w in tl if t[w["cs"]:w["ce"]] != w["w"])
              print(f"  {d['level_code']:7} 时间轴{len(tl):4}词 错位{bad}  "
                    f"中译{len(zh)}/{len(paras)}段  "
                    f"title={'有' if d.get('title_zh') else '无'}  "
                    f"配图={(d.get('image') or {}).get('type')}")
          PY
          set -e

      - name: 记录本次运行
        # 让仓库保持活跃 —— 60 天无活动的仓库会被 GitHub 自动禁用定时任务
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .runs
          printf '{"last_run":"%s","status":"%s"}\n' "$(date -u +%FT%TZ)" "$JOB_STATUS" > .runs/latest.json
          git add -A .runs
          git commit -m "chore: 记录任务运行 $(date -u +%FT%TZ)" || echo "无变更"
          git push || echo "推送失败"