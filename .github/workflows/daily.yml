name: 每日内容生成

#北京时间每天 05:00 = UTC 21:00。故意避开整点，错开 GitHub 的调度高峰。
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      topics:
        description: '主题（逗号分隔，留空用默认全部）'
        required: false
      per_topic:
        description: '每个主题几篇'
        required: false
        default: '1'
      force:
        description: '是否强制重建已有内容'
        required: false
        default: 'false'

# Free 计划同一时间只允许 1 个并发任务
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          # R2 上传的备用通道（runner 的 Python TLS 与 Cloudflare 握手失败时启用）
          sudo apt-get update -qq && sudo apt-get install -y -qq awscli
          aws --version

      - name: R2 连通性自检
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set +e
          echo "probe" > /tmp/probe.txt
          echo "--- [1] boto3 ---"
          python -c "
          import os, boto3
          from botocore.config import Config
          c = boto3.client('s3', endpoint_url=os.environ['R2_ENDPOINT'],
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              region_name='auto',
              config=Config(signature_version='s3v4', s3={'addressing_style':'path'}))
          c.put_object(Bucket=os.environ['R2_BUCKET'], Key='_probe_boto3.txt', Body=b'probe')
          print('boto3: OK')
          " 2>&1 | tail -3
          echo "--- [2] aws cli ---"
          aws s3 cp /tmp/probe.txt "s3://${R2_BUCKET}/_probe_cli.txt" \
            --endpoint-url "${R2_ENDPOINT}" --no-progress 2>&1 | tail -2
          aws s3 cp "s3://${R2_BUCKET}/_probe_cli.txt" /tmp/back.txt \
            --endpoint-url "${R2_ENDPOINT}" --no-progress 2>&1 | tail -2 && echo "awscli: OK"
          set -e

      - name: 组装参数
        id: args
        env:
          IN_TOPICS: ${{ inputs.topics }}
          IN_PER_TOPIC: ${{ inputs.per_topic }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          ARGS="daily --per-topic ${IN_PER_TOPIC:-1}"
          if [ -n "${IN_TOPICS}" ]; then
            ARGS="$ARGS --topics ${IN_TOPICS}"
          fi
          if [ "${IN_FORCE}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "将要执行: python -m app.cli $ARGS"

      - name: 生成内容（抓取 → 改写 → TTS → 导出）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: deepseek-chat
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          LLM_PROVIDER: deepseek
          TTS_VOICE_EN: en-US-AriaNeural
          TTS_VOICE_JA: ja-JP-NanamiNeural
          TOPICS: tech,business,science,health,sports,culture,world
        run: python -m app.cli ${{ steps.args.outputs.args }}

      - name: 记录本次运行
        # 让仓库保持活跃 —— 60 天无活动的仓库会被 GitHub 自动禁用定时任务
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .runs
          printf '{"last_run":"%s","status":"%s"}\n' "$(date -u +%FT%TZ)" "$JOB_STATUS" > .runs/latest.json
          git add -A .runs
          git commit -m "chore: 记录任务运行 $(date -u +%FT%TZ)" || echo "无变更可提交"
          git push || echo "推送失败（不影响内容生成结果）"