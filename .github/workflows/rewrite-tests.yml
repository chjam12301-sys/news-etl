name: Bilingual rewrite regression
on:
  pull_request:
    paths:
      - 'app/rewriter.py'
      - 'app/pipeline.py'
      - 'tests/test_rewrite_length.py'
      - '.github/workflows/rewrite-tests.yml'
  push:
    branches: [main]
    paths:
      - 'app/rewriter.py'
      - 'app/pipeline.py'
      - 'tests/test_rewrite_length.py'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest-asyncio
      - run: python -m pytest -q tests/test_rewrite_length.py
      - run: python -m pytest -q
